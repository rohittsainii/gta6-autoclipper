name: Find moments
on:
  schedule:
    - cron: "7 * * * *"      # every hour
  workflow_dispatch:
  push:
    paths: ["config/**", "clipper/find_moments.py"]
concurrency:
  group: find
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Tools
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q -r requirements.txt
      - name: Find the best moments
        run: python -m clipper.find_moments
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          MAX_RUN_MINUTES: "240"
      - name: Save results to the repo
        if: always()
        run: |
          git config user.name "clipper-bot"
          git config user.email "clipper-bot@users.noreply.github.com"
          git add state candidates || true
          git commit -q -m "moments $(date -u +%F_%H%M)" || exit 0
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && break; sleep 7; done
