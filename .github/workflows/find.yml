name: Find moments
# One run loops every 30 min for ~4.5 h, then starts its own successor, so it never stops.
# The schedule is only a backup that restarts the chain if it ever breaks.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    paths: ["config/**", "clipper/find_moments.py"]
concurrency:
  group: find
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Tools
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q -r requirements.txt
      - name: Find the best moments every 30 minutes
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          MAX_RUN_MINUTES: "60"
        run: |
          end=$(( $(date +%s) + 270*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            t0=$(date +%s)
            git pull -q --rebase || true
            python -m clipper.find_moments || echo "::warning::finder crashed this round"
            ./scripts/save.sh "moments" state candidates config
            wait=$(( 1800 - ($(date +%s) - t0) ))
            if [ "$wait" -gt 0 ] && [ $(( $(date +%s) + wait )) -lt "$end" ]; then sleep "$wait"
            elif [ "$wait" -gt 0 ]; then break
            fi
          done
          echo "loop finished normally"
      - name: Start the next run (keeps the chain going)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run find.yml --ref main
