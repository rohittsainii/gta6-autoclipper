name: Render clips
on:
  push:
    paths: ["picks/*.json"]
  workflow_dispatch:
concurrency:
  group: render
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Tools + caption font
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q -r requirements.txt
          mkdir -p fonts
          curl -sfL -o fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf || true
          file fonts/Anton-Regular.ttf | grep -qi font || rm -f fonts/Anton-Regular.ttf
          # OpenCV's YuNet face model (official opencv_zoo), used to find the streamer's webcam face
          mkdir -p models
          curl -sfL -o models/face_detection_yunet_2023mar.onnx https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx || true
          [ "$(stat -c %s models/face_detection_yunet_2023mar.onnx 2>/dev/null || echo 0)" -gt 100000 ] || rm -f models/face_detection_yunet_2023mar.onnx
          ls -la models || true
      - name: Render picked clips
        run: |
          # only the picks files added/changed by this push (avoids re-rendering old clips)
          if [ "${{ github.event_name }}" = "push" ]; then
            files=$(git diff --name-only --diff-filter=AM "${{ github.event.before }}" "${{ github.sha }}" -- 'picks/*.json' || true)
          fi
          echo "picks to render: ${files:-all not yet rendered}"
          python -m clipper.render $files
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      - name: Publish each clip as its own GitHub Release (Zapier posts new releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for d in out/*/; do
            d=${d%/}
            [ -f "$d/clip.mp4" ] || continue
            title=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["title"])' "$d/meta.json")
            python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); print(m["description"])' "$d/meta.json" > "$d/notes.md"
            sample=$(python3 -c 'import json,sys; print("yes" if json.load(open(sys.argv[1])).get("sample") else "no")' "$d/meta.json")
            plat=$(python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); print("-".join({"youtube":"yt","instagram":"ig","facebook":"fb","tiktok":"tt"}[p] for p in m.get("platforms",["youtube","instagram","facebook"])))' "$d/meta.json")
            tag="clip-$(date -u +%Y%m%d-%H%M%S)-$(basename "$d" | tr '_' '-' | cut -c1-40)--${plat}"
            if [ "$sample" = "yes" ]; then
              gh release create "$tag" "$d/clip.mp4" --title "[SAMPLE] $title" --notes-file "$d/notes.md" --prerelease
            else
              gh release create "$tag" "$d/clip.mp4" --title "$title" --notes-file "$d/notes.md"
            fi
            echo "released $tag"
            sleep 3
          done
      - name: Mark picks as rendered
        if: always()
        run: ./scripts/save.sh "rendered" picks state
