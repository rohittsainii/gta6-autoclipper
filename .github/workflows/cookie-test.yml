name: Cookie check
# Checks the YT_COOKIES secret without printing it: counts YouTube login cookies
# and asks yt-dlp to read one GTA 6 stream page (no download).
on:
  push:
    paths: [".github/cookie-test-trigger"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -r requirements.txt
      - name: Test cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          printf '%s\n' "$YT_COOKIES" > /tmp/c.txt
          {
            echo "# Cookie check $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- lines in secret: $(grep -c . /tmp/c.txt)"
            echo "- youtube.com cookies: $(grep -c 'youtube.com' /tmp/c.txt)"
            echo "- login cookies (SID/LOGIN_INFO/__Secure-3PSID): $(grep -cE $'\t(SID|LOGIN_INFO|__Secure-3PSID)\t' /tmp/c.txt)"
            if yt-dlp --cookies /tmp/c.txt --no-warnings -s --print title "https://www.youtube.com/watch?v=yX4DH_msPkI" > /tmp/out.txt 2> /tmp/err.txt; then
              echo "- yt-dlp read a YouTube stream: OK ($(head -c 80 /tmp/out.txt))"
            else
              echo "- yt-dlp FAILED: $(grep -oiE 'sign in[^.]*|not a bot|HTTP Error [0-9]+[^.]*|ERROR:[^\n]{0,160}' /tmp/err.txt | head -2 | tr '\n' ' ')"
            fi
            echo ""
            echo "## Live download test, 8 parallel pieces (3 min of each creator's newest YouTube stream)"
            for src in "Kai Cenat|https://www.youtube.com/channel/UCvCfpQXRXdJdL07pzTIA6Cw/streams" "Dylan Page|https://www.youtube.com/@dylan.page./streams" "KreekCraft|https://www.youtube.com/@Kreek/streams" "BrettLiftsXP|https://www.youtube.com/@BrettLiftsXP/videos"; do
              name="${src%%|*}"; url="${src#*|}"
              vid=$(yt-dlp --cookies /tmp/c.txt --no-warnings --flat-playlist --playlist-end 1 --print id "$url" 2>/tmp/e1.txt | head -1)
              if [ -z "$vid" ]; then echo "- $name: could not list videos: $(grep -oE 'ERROR:.{0,140}' /tmp/e1.txt | head -1)"; continue; fi
              t0=$(date +%s); rm -f /tmp/t_*
              if timeout 300 yt-dlp --cookies /tmp/c.txt --no-warnings -N 8 -f 'ba/worst' --download-sections '*600-780' -o "/tmp/t_$vid.%(ext)s" "https://www.youtube.com/watch?v=$vid" >/dev/null 2>/tmp/e2.txt; then
                f=$(ls /tmp/t_$vid.* | head -1); d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f" | cut -d. -f1)
                echo "- $name: OK, got ${d}s of audio from video $vid in $(( $(date +%s)-t0 ))s"
              else
                echo "- $name: FAILED on $vid after $(( $(date +%s)-t0 ))s: $(grep -oiE 'sign in[^.]*|not a bot|HTTP Error [0-9]+[^.]*|ERROR:.{0,140}' /tmp/e2.txt | head -1)"
              fi
            done
          } > state/cookie_check.md
          rm -f /tmp/c.txt
          cat state/cookie_check.md
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/cookie_check.md
          git commit -m "cookie check" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
